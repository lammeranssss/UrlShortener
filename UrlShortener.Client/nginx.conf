server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Защита от DoS-атак через ограничение размера тела запроса
    client_max_body_size 2M;

    # OWASP Security Headers против Clickjacking, MIME-sniffing и XSS
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # 1. SPA Root Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Кэширование статичных ресурсов Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 3. Reverse Proxy для REST API бэкенда
    location /api/ {
        proxy_pass http://api:5200/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'keep-alive';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Reverse Proxy для коротких кодов (ровно 7 символов Base62)
    # Кавычки вокруг регулярного выражения обязательны, чтобы Nginx не принимал {7} за блок конфигурации
    location ~ "^/[a-zA-Z0-9]{7}$" {
        proxy_pass http://api:5200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}